# 어안 → 톱뷰 모아레 실험 설정
# 코드에 숫자를 박지 말고 여기에 둔다. 값을 바꿔 가며 다시 돌려 보는 것이 이 실험의 핵심.

camera:                 # 사이드 미러 카메라 (등거리 어안)
  width: 1280
  height: 960           # 1824×1536 으로 바꾸면 근거리 축소율이 약 1.4배 커진다 (고해상도일수록 모아레가 심해짐)
  hfov_deg: 190
  height_m: 0.95
  pitch_deg: 60         # 수평에서 아래로

render:                 # 합성 어안 영상 만들기
  ss: 4                 # 센서 화소 하나를 ss×ss 점으로 적분
  lens_sigma: 0.6       # 렌즈 번짐 (화소)

topview:
  gsd_m: 0.01           # 톱뷰 화소 하나 = 1 cm. 0.02 로 바꾸면 축소율이 2배 → 모아레가 훨씬 심해진다
  x_range_m: [-3.0, 3.0]    # 차 진행 방향 (카메라 기준 좌우)
  y_range_m: [0.2, 6.2]     # 차에서 바깥쪽
  near_far_m: [1.5, 3.5]    # 근거리 / 중거리 / 원거리 경계 (Y)

# 방법별 파라미터 (main.py 의 build_methods 에서 쓴다)
params:
  sharpen_amount: 1.0   # ISP 엣지 강조 흉내: 원본 + amount × (원본 − 블러)
  sharpen_sigma: 1.0
  blur_weak: 1.0        # 균일 프리블러 σ (원본 화소)
  blur_strong: 2.5
  supersample: 2        # 톱뷰를 몇 배로 크게 그렸다가 줄일지
  levels: 5             # 피라미드 단계 수 (1/2 … 1/32)
  lod_bias: 0.0         # 밉맵 레벨 + bias. 양수 = 더 흐리게(안전), 음수 = 더 선명하게(모아레 위험)
  max_probes: 8         # 비등방 필터의 최대 탭 수

# python main.py --tune 의 트랙바 범위 [최소, 최대, 간격]
tune:
  blur_strong: [0.0, 4.0, 0.1]
  lod_bias: [-1.0, 2.0, 0.25]

metrics:
  flat_margin_px: 3     # 깜빡임 지표: 정답의 경계에서 이만큼 떨어진 '평평한' 화소만 잰다

video:                  # 차가 움직일 때의 깜빡임
  frames: 10
  step_m: 0.01          # 프레임당 이동 거리. gsd 의 정수배여야 움직임 보정이 정확하다 (1 cm × 30 fps ≈ 1 km/h)
